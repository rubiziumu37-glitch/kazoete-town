<meta charset="utf-8">
<title>かぞえてタウン</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* 画面の考え方：水彩の箱庭の町。紙のような明るい空色を地に、
   カードと箱は「色紙」、操作ボタンは大きく丸く。ゲームの世界なので明るい見た目に固定する */
:root{
  --sora:#e6f2f6;      /* 空のような地の色 */
  --kami:#fffdf8;      /* 紙（カード・パネル） */
  --sumi:#33414d;      /* 文字 */
  --usuzumi:#6b7884;   /* うすい文字 */
  --mint:#7cc7a8;      /* 草のミント（すすむ） */
  --mint-koi:#3f9c7a;
  --sango:#ef8a6f;     /* さんご（ちゅうい・えらんでいる） */
  --suisho:#a28ee0;    /* 水晶のラベンダー */
  --kin:#f2b84b;       /* コイン・ひかる */
  --sen:#d9e3e8;       /* 線 */
  --font:"Zen Maru Gothic","Hiragino Maru Gothic ProN","BIZ UDPGothic","Meiryo",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--sora);color:var(--sumi);font-family:var(--font);font-weight:500;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{min-height:100%;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px;box-sizing:border-box;gap:12px;max-width:1200px;margin:0 auto}
h1,h2,h3{margin:0;text-wrap:balance}
button{font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,[role=button]:focus-visible{outline:4px solid var(--suisho);outline-offset:2px}
.btn{border:0;border-radius:999px;padding:14px 26px;font-size:1.15rem;font-weight:700;background:var(--mint);color:#fff;
  box-shadow:0 4px 0 var(--mint-koi);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--mint-koi)}
.btn.sub{background:var(--kami);color:var(--sumi);box-shadow:0 4px 0 var(--sen);border:2px solid var(--sen)}
.btn.small{padding:8px 16px;font-size:1rem}
.btn[disabled]{opacity:.45;pointer-events:none}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bar .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--kami);border:2px solid var(--sen);border-radius:999px;
  padding:6px 14px;font-weight:700;font-variant-numeric:tabular-nums;font-size:1rem}
.pill img{width:26px;height:26px}
.panel{background:var(--kami);border-radius:22px;border:2px solid var(--sen);padding:18px}
.msg{font-size:1.3rem;font-weight:700;text-align:center;min-height:1.6em}
.sub-msg{color:var(--usuzumi);text-align:center}

/* はじめ */
.title-wrap{flex:1;display:grid;place-items:center}
.title-card{width:min(560px,100%);display:flex;flex-direction:column;gap:16px;align-items:stretch}
.logo{font-size:clamp(2.4rem,7vw,3.6rem);font-weight:900;text-align:center;letter-spacing:.04em;color:var(--sumi)}
.logo span{color:var(--mint-koi)}
.logo small{display:block;font-size:1rem;color:var(--usuzumi);letter-spacing:.1em;font-weight:700}
.field{display:flex;flex-direction:column;gap:6px;font-weight:700}
.field input{font:inherit;font-size:1.4rem;padding:12px 16px;border-radius:14px;border:2px solid var(--sen);background:#fff;color:var(--sumi);-webkit-user-select:text;user-select:text}
.field input:focus{outline:3px solid var(--suisho)}
.field select{font:inherit;font-size:1.2rem;padding:12px 10px;border-radius:14px;border:2px solid var(--sen);background:#fff;color:var(--sumi)}
.who-list{display:flex;flex-wrap:wrap;gap:8px}
.who-list button{border:2px solid var(--sen);background:#fff;border-radius:14px;padding:10px 14px;font-size:1.05rem;font-weight:700}
.err{color:#c4553a;font-weight:700;min-height:1.4em}

/* パートナーえらび */
.sei-pick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.sei-pick button{border:4px solid var(--sen);background:#fff;border-radius:24px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:1.3rem;font-weight:900}
.sei-pick button img{width:100%;max-width:170px;aspect-ratio:1;object-fit:contain}
.sei-pick button.sel{border-color:var(--suisho);background:#f6f2ff}
.sei-pick small{font-size:.9rem;color:var(--usuzumi);font-weight:700}

/* まち */
.town-wrap{display:flex;flex-direction:column;gap:10px}
.town{position:relative;width:100%;aspect-ratio:16/9;max-height:68vh;border-radius:24px;overflow:hidden;
  background:#cfe6ef center/cover no-repeat;align-self:center}
.slot{position:absolute;width:12%;aspect-ratio:1;transform:translate(-50%,-85%);border:0;background:none;padding:0}
.slot img{width:100%;height:100%;object-fit:contain;object-position:bottom;filter:drop-shadow(0 4px 3px rgba(60,80,70,.25))}
.slot.empty::after{content:"";position:absolute;left:20%;right:20%;bottom:6%;height:22%;border-radius:50%;
  border:3px dashed rgba(255,255,255,.9);background:rgba(255,255,255,.25)}
.slot.empty{pointer-events:none;opacity:0}
.placing .slot.empty{pointer-events:auto;opacity:1;animation:yure 1.2s ease-in-out infinite}
.slot.over::after{background:rgba(242,184,75,.5)}
.slot.pick img{outline:4px solid var(--sango);border-radius:12px}
@keyframes yure{50%{transform:translate(-50%,-88%)}}
.tray{display:flex;gap:10px;overflow-x:auto;padding:6px 2px;min-height:96px;align-items:center}
.tray button{flex:0 0 auto;width:92px;height:92px;border-radius:18px;border:3px solid var(--sen);background:var(--kami);padding:4px;touch-action:none}
.tray button.sel{border-color:var(--sango);transform:translateY(-4px)}
.tray img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.tray .none{color:var(--usuzumi)}
.partner-btn{border:2px solid var(--sen);background:var(--kami);border-radius:999px;padding:2px 12px 2px 2px;display:flex;align-items:center;gap:4px;font-weight:700}
.partner-btn img{width:44px;height:44px;object-fit:contain}

/* ステージえらび */
.stages{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:640px){.stages{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stage{border:3px solid var(--sen);background:var(--kami);border-radius:20px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:1.1rem;font-weight:700}
.stage .who{display:flex;align-items:flex-end;gap:2px}
.stage .who img{width:64px;height:64px;object-fit:contain}
.stage .who img.b{width:54px;height:54px}
.stage.lock{opacity:.5}
.stage.lock img.b{filter:brightness(0) opacity(.25)}
.stage .st{font-size:.85rem;color:var(--usuzumi)}
.stage.done{border-color:var(--mint)}

/* あそぶ画面 */
.play{display:flex;flex-direction:column;gap:12px}
.irai{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:end}
.irai .client{width:96px;height:110px;object-fit:contain;object-position:bottom}
.fukidashi{position:relative;background:#fff;border:3px solid var(--sumi);border-radius:20px;padding:12px 16px;font-size:1.2rem;font-weight:700;line-height:1.6}
.fukidashi::before{content:"";position:absolute;left:-14px;bottom:18px;border:10px solid transparent;border-right:14px solid var(--sumi);border-left:0}
.fukidashi .yomu{float:right;margin:0 0 4px 8px;border:2px solid var(--sen);background:var(--kami);border-radius:999px;padding:4px 10px;font-size:.95rem;font-weight:700}
.fukidashi .need{display:inline-flex;align-items:center;gap:4px;background:var(--sora);border-radius:10px;padding:0 8px;margin:0 2px}
.fukidashi .need img{width:30px;height:30px;object-fit:contain}
.partner{display:flex;flex-direction:column;align-items:center;gap:4px}
.partner img{width:92px;height:100px;object-fit:contain}
.partner .hint{padding:6px 14px;font-size:.95rem}
.p-line{font-weight:700;color:var(--usuzumi);text-align:center;font-size:.95rem;max-width:12em}
@media (max-width:640px){.irai{grid-template-columns:auto 1fr}.irai .partner{grid-column:1/-1;flex-direction:row;justify-content:center}.irai .client{width:70px;height:80px}.partner img{width:64px;height:70px}}
.cards{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:120px;align-content:flex-start}
.card{width:96px;height:112px;border-radius:16px;border:3px solid var(--sen);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;box-sizing:border-box;touch-action:none}
.card img{width:70px;height:70px;object-fit:contain;pointer-events:none}
.card span{font-size:.85rem;font-weight:700;pointer-events:none}
.card.sel{border-color:var(--sango);transform:translateY(-6px) rotate(-3deg);box-shadow:0 8px 14px rgba(239,138,111,.35)}
.card.glow,.box.glow .in{box-shadow:0 0 0 5px var(--kin),0 0 18px var(--kin)}
.card.ghost{transform:rotate(-4deg);opacity:.92}
.boxes{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:12px}
/* 箱：上に「なふだ」（数えない）、下の四角い枠の中だけがカードを入れる場所 */
.box{display:flex;flex-direction:column;align-items:center;gap:0}
.box h3{display:flex;align-items:center;gap:6px;font-size:1.05rem;background:var(--sumi);color:#fff;
  border-radius:12px 12px 0 0;padding:4px 14px 4px 6px}
.box h3 img{width:30px;height:30px;object-fit:contain;background:#fff;border-radius:8px;padding:2px}
.box h3 .iro{width:26px;height:26px;border-radius:50%;border:3px solid #fff}
.box .in{align-self:stretch;min-height:120px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-content:flex-start;
  padding:10px;border:4px solid var(--sumi);border-radius:14px;background:#fff}
.box .in .m{position:relative;width:44px;height:44px;border:0;background:none;padding:0}
.box .in .m img{width:44px;height:44px;object-fit:contain}
.box .in .m b{position:absolute;right:-4px;top:-6px;background:var(--sango);color:#fff;border-radius:50%;width:22px;height:22px;font-size:.8rem;display:grid;place-items:center}
.box.on .in{border-color:var(--suisho);box-shadow:0 0 0 5px rgba(162,142,224,.3)}
.box.on h3{background:var(--suisho)}
.box.ok .in{border-color:var(--mint-koi)}
.box.ok h3{background:var(--mint-koi)}
.box.over .in{border-color:var(--sango);background:#fff4ef}
.box .num{font-size:2.2rem;font-weight:900;color:var(--mint-koi);font-variant-numeric:tabular-nums;min-height:1.2em}
.box.target h3{outline:3px solid var(--kin)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(5,minmax(0,64px));gap:10px;justify-content:center}
.pad button{height:64px;border-radius:16px;border:3px solid var(--sen);background:#fff;font-size:1.7rem;font-weight:900;font-variant-numeric:tabular-nums}
.pad button:active{background:var(--sora)}
.choices{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.choices button{border:3px solid var(--sen);background:#fff;border-radius:20px;padding:10px 18px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:1.2rem;font-weight:700;min-width:120px}
.choices img{width:80px;height:80px;object-fit:contain}
.choices .iro{width:60px;height:60px;border-radius:50%;border:3px solid var(--sen)}
.choices button.bad{border-color:var(--sango)}
.step{display:flex;gap:6px;justify-content:center}
.step i{width:34px;height:8px;border-radius:4px;background:var(--sen)}
.step i.on{background:var(--mint)}

/* クリア */
.clear{flex:1;display:grid;place-items:center}
.clear .panel{display:flex;flex-direction:column;align-items:center;gap:12px;width:min(560px,100%);text-align:center}
.clear .big{font-size:3rem;font-weight:900;color:var(--mint-koi)}
.clear .pair{display:flex;align-items:flex-end;gap:12px}
.clear .pair img{width:110px;height:120px;object-fit:contain}
.clear .reward{width:170px;height:170px;object-fit:contain;animation:pop .6s ease-out}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1)}}
.coinline{display:flex;align-items:center;gap:8px;font-size:1.4rem;font-weight:900}
.coinline img{width:36px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:640px){.card{width:84px;height:100px}.card img{width:58px;height:58px}}
/* ---- ②-2で足したもの ---- */
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{border:2px solid var(--sen);background:var(--kami);border-radius:999px;padding:8px 16px;font-weight:700;font-size:1rem}
.tabs button.on{background:var(--sumi);color:#fff;border-color:var(--sumi)}
.tabs button[disabled]{opacity:.4}
.work{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:760px){.work{grid-template-columns:minmax(0,1fr)}}
.work.one{grid-template-columns:minmax(0,1fr)}
/* ひょう */
.hyo{border-collapse:collapse;background:#fff;font-size:1.15rem;margin:0 auto}
.hyo caption{font-weight:900;padding:4px 0 8px}
.hyo th,.hyo td{border:3px solid var(--sumi);padding:6px 12px;text-align:center;min-width:70px}
.hyo th{background:#f3f6f8;font-weight:700}
.hyo th .lab{display:inline-flex;align-items:center;gap:6px}
.hyo th img{width:32px;height:32px;object-fit:contain}
.hyo th .iro{width:22px;height:22px;border-radius:50%;display:inline-block}
.hyo td{font-size:1.5rem;font-weight:900;font-variant-numeric:tabular-nums;min-height:1.5em}
.hyo td.on{background:#f1ecff;box-shadow:inset 0 0 0 3px var(--suisho)}
.hyo td.ok{color:var(--mint-koi)}
.hyo tr.total th,.hyo tr.total td{border-top-width:5px}
.hyo .unit{font-size:.85rem;color:var(--usuzumi);font-weight:700}
.wrap-x{overflow-x:auto;max-width:100%}
/* ぼうグラフ */
.graph{display:flex;flex-direction:column;align-items:center;gap:6px;background:#fff;border-radius:18px;border:2px solid var(--sen);padding:12px 12px 8px}
.graph .gt{font-weight:900;font-size:1.15rem;min-height:1.4em}
.graph .gt.empty{color:var(--usuzumi);font-weight:700;font-size:1rem}
.ggrid{display:grid;grid-template-columns:auto auto;column-gap:6px;row-gap:4px;margin-top:1.4em;max-width:100%;overflow-x:auto}
.yaxis{display:flex;flex-direction:column-reverse;justify-content:flex-start;font-variant-numeric:tabular-nums;font-weight:700;font-size:.85rem;color:var(--usuzumi);text-align:right;position:relative}
.yaxis span{height:var(--u);display:flex;align-items:flex-start;justify-content:flex-end;transform:translateY(-.55em);padding-right:4px}
.yaxis .yu{position:absolute;top:-1.8em;right:0;white-space:nowrap}
.plot{position:relative;display:flex;align-items:flex-end;gap:10px;padding:0 8px;border-left:3px solid var(--sumi);border-bottom:3px solid var(--sumi);
  background-image:repeating-linear-gradient(to top,transparent 0,transparent calc(var(--u) - 1px),#e3e9ee calc(var(--u) - 1px),#e3e9ee var(--u));height:calc(var(--u) * var(--rows))}
.col{width:54px;height:100%;display:flex;flex-direction:column-reverse;border:0;background:none;padding:0;position:relative}
.col.can{cursor:pointer}
.col.can:hover{background:rgba(162,142,224,.08)}
.col.bad{background:rgba(239,138,111,.15)}
.blk{height:var(--u);box-sizing:border-box;border:2px solid #fff;border-radius:6px;background:linear-gradient(135deg,#bfe7f5,#a28ee0)}
.blk.half{height:calc(var(--u) / 2)}
.xlabels{display:flex;gap:10px;padding:0 8px 0 calc(8px + 3px)}
.xlabels,.minus{align-self:start}
.xlabels div{width:54px;display:flex;flex-direction:column;align-items:center;font-size:.8rem;font-weight:700;text-align:center;line-height:1.2}
.xlabels img{width:34px;height:34px;object-fit:contain}
.xlabels .iro{width:22px;height:22px;border-radius:50%}
.minus{display:flex;gap:10px;padding:0 8px 0 calc(8px + 3px)}
.minus button{width:54px;border:2px solid var(--sen);background:var(--kami);border-radius:10px;font-weight:900;font-size:1.1rem;padding:2px 0}
/* ならべる */
.order-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.order-row button{border:3px solid var(--sen);background:#fff;border-radius:16px;padding:8px 12px;display:flex;flex-direction:column;align-items:center;font-weight:700;min-width:84px}
.order-row button img{width:48px;height:48px;object-fit:contain}
.order-row .done{opacity:.35}
.order-row .glow{box-shadow:0 0 0 5px var(--kin),0 0 18px var(--kin)}
.order-line{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;min-height:60px;align-items:center}
.order-line span{background:var(--sora);border-radius:12px;padding:6px 10px;font-weight:700;display:flex;align-items:center;gap:4px}
.order-line img{width:30px;height:30px;object-fit:contain}
/* 2つのクラス */
.classes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.cls{border:4px solid var(--sumi);border-radius:16px;background:#fff;padding:8px}
.cls h3{text-align:center;margin-bottom:6px}
.cls .in{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.cls .in .m{position:relative;width:46px;height:46px;border:0;background:none;padding:0}
.cls .in .m img{width:46px;height:46px;object-fit:contain}
.cls .in .m.glow{border-radius:10px;box-shadow:0 0 0 4px var(--kin)}
.cls .in .m b{position:absolute;right:-4px;top:-6px;background:var(--sango);color:#fff;border-radius:50%;width:22px;height:22px;font-size:.8rem;display:grid;place-items:center}
.cls.c1{border-color:#5aa9d6}.cls.c2{border-color:#e98aa8}
.qcount{font-weight:700;color:var(--usuzumi);text-align:center}
.newchiku{font-weight:900;color:var(--suisho);font-size:1.2rem}
.pad.wide{grid-template-columns:repeat(10,minmax(0,52px))}
.pad.wide button{height:52px;font-size:1.3rem}
@media (max-width:640px){.pad.wide{grid-template-columns:repeat(5,minmax(0,56px))}.col,.xlabels div,.minus button{width:40px}}
.choices.text button{font-size:1.1rem;min-width:220px;max-width:420px}

@media (max-width:640px){.boxes{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}}

/* ---- ②-3 お店と自分の家 ---- */
.town-go .btn{display:inline-flex;align-items:center;gap:8px}
.town-go .btn img{width:34px;height:34px;object-fit:contain;margin:-6px 0}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
@media (max-width:640px){.shop{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.shina{padding:6px 4px;font-size:.85rem}.price{font-size:1rem;padding:2px 8px}}
.shina{display:flex;flex-direction:column;align-items:center;gap:6px;border:3px solid var(--sen);background:var(--kami);border-radius:20px;padding:10px 8px;font-size:1rem;text-align:center}
.shina b,.shina .why{word-break:keep-all;overflow-wrap:anywhere}
.shina b{font-weight:700;line-height:1.3;min-height:2.6em;display:grid;place-items:center}
.shina .ph,.modal .ph{width:100%;aspect-ratio:1;display:grid;place-items:center;border-radius:14px;background:#f3f7f1}
.shina .ph,.modal .ph{position:relative}
.shina .ph img,.modal .ph img{position:absolute;left:6%;top:6%;width:88%;height:88%;object-fit:contain}
.shina .ph.wide img,.modal .ph.wide img{position:static}
.shina .ph.wide img,.modal .ph.wide img{width:100%;height:auto;border-radius:10px}
.shina.lock{opacity:.55}
.shina.lock .ph{font-size:2.6rem;font-weight:900;color:var(--usuzumi)}
.shina.have{opacity:.6}
.shina .why{font-size:.85rem;color:var(--usuzumi);font-weight:700}
.price{display:inline-flex;align-items:center;gap:4px;font-weight:900;font-size:1.2rem;background:#fff6dc;border-radius:999px;padding:2px 12px}
.price img{width:24px;height:24px}
.price.short{background:#eef1f3;color:var(--usuzumi)}
.modal{position:fixed;inset:0;background:rgba(40,55,65,.45);display:grid;place-items:center;z-index:60;padding:16px}
.modal .panel{display:flex;flex-direction:column;align-items:center;gap:10px;width:min(420px,100%);text-align:center}
.modal .ph{width:min(240px,70%)}
.modal .ph.wide{width:100%;aspect-ratio:auto;background:none}
.modal .big{font-size:2.6rem;font-weight:900;color:var(--mint-koi)}
.modal .coinline{display:flex;align-items:center;gap:6px;font-size:1.8rem;font-weight:900}
.modal .coinline img{width:36px;height:36px}
/* わたしの いえ */
/* 横はばは 画面の高さにも あわせる（したの トレイまで 1画面に おさめる。たて横の比は かえない） */
.scene{position:relative;width:min(100%,max(360px,calc((100vh - 390px) * 16 / 9)));aspect-ratio:16/9;margin:0 auto;border-radius:24px;overflow:hidden;
  background-color:#c9e7f3;background-size:cover;background-position:center;border:2px solid var(--sen);touch-action:none}
.scene.heya{background-color:#c9e7f3}
/* 庭の土台の絵が まだ ないときの 仮の しばふ */
.scene.niwa:not([style*="background-image"]){background-image:
  radial-gradient(ellipse 38% 22% at 50% 64%,rgba(214,196,150,.85),rgba(214,196,150,0) 70%),
  radial-gradient(ellipse 30% 26% at 18% 40%,rgba(150,200,120,.55),transparent 70%),
  radial-gradient(ellipse 34% 24% at 82% 72%,rgba(140,195,115,.5),transparent 70%),
  radial-gradient(ellipse 60% 40% at 50% 60%,#bfe3a2,#a9d68c 70%,#9acb7e)}
.scene .house{position:absolute;left:50%;top:56%;transform:translate(-50%,-100%);pointer-events:none}
.scene .house img{width:100%;display:block;filter:drop-shadow(0 6px 4px rgba(60,80,70,.25))}
.put{position:absolute;transform:translate(-50%,-100%);border:0;background:none;padding:0;touch-action:none}
.put img{width:100%;display:block;pointer-events:none;filter:drop-shadow(0 4px 3px rgba(60,80,70,.22))}
.put.sel img{outline:3px dashed var(--sango);outline-offset:3px;border-radius:8px}
.put.ghost{transform:none}
.shimau{position:absolute;transform:translate(-50%,0);z-index:5}
.looks{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;font-weight:700}
.looks button{width:64px;height:64px;border:3px solid var(--sen);background:var(--kami);border-radius:14px;padding:3px}
.looks button.on{border-color:var(--mint-koi);background:#eaf7f0}
.looks img{width:100%;height:100%;object-fit:contain}
.tray button.off{opacity:.4}

/* ---- ③ はじめの画面・先生画面・コード ---- */
.title-bg{position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center;filter:saturate(.95)}
.title-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(230,242,246,.25),rgba(230,242,246,.7) 55%,rgba(230,242,246,.9))}
.title-top{display:flex;justify-content:flex-end;gap:8px}
.title-top .pill{font-size:.9rem;padding:6px 14px;cursor:pointer}
.title-wrap .logo{background:rgba(255,253,248,.88);border-radius:24px;padding:14px 10px 10px;border:2px solid var(--sen)}
.title-sei{display:flex;justify-content:center;align-items:flex-end;gap:4px;margin:-6px 0 -4px}
.title-sei img{width:min(130px,28vw);aspect-ratio:1;object-fit:contain;filter:drop-shadow(0 6px 6px rgba(60,80,110,.2));animation:fuwa 3.2s ease-in-out infinite}
.title-sei img:nth-child(2){width:min(150px,32vw);animation-delay:-1s}
.title-sei img:nth-child(3){animation-delay:-2s}
@keyframes fuwa{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){.title-sei img{animation:none}}
.notice{border-color:var(--mint);display:flex;flex-direction:column;gap:4px}
.notice b{color:var(--mint-koi)}
.code-box{font:inherit;font-family:ui-monospace,Consolas,monospace;font-size:.85rem;width:100%;box-sizing:border-box;border:2px solid var(--sen);border-radius:12px;padding:10px;background:#fff;color:var(--sumi);word-break:break-all;-webkit-user-select:text;user-select:text;resize:vertical}
.res{display:flex;flex-direction:column;gap:4px;font-weight:700}
.miseru{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.miseru details{width:100%;text-align:left}
.miseru summary{cursor:pointer;font-weight:700;padding:6px 0}
.qr{width:min(300px,78vw);background:#fff;border-radius:12px;padding:4px}
.qr.big{width:min(420px,86vw)}
.qr svg{width:100%;height:auto;display:block}
.modal .miseru{width:min(480px,100%);max-height:92vh;overflow:auto}
.tpanel{display:flex;flex-direction:column;gap:12px}
.ttable{border-collapse:collapse;width:100%;background:#fff;font-size:1rem}
.ttable th,.ttable td{border-bottom:1px solid var(--sen);padding:8px 10px;text-align:left;white-space:nowrap}
.ttable thead th{background:#f3f6f8;font-size:.9rem}
.ttable tbody tr[data-k]{cursor:pointer}
.ttable tbody tr[data-k]:hover{background:#f6f2ff}
.ttable td.low{background:#fdebe5;font-weight:700}
.karte tbody th{font-weight:700}
.rbar{display:inline-block;width:80px;height:10px;border-radius:5px;background:#e7edf0;margin-right:8px;vertical-align:middle;overflow:hidden}
.rbar i{display:block;height:100%;background:var(--mint)}
.ox b{font-size:1.1rem;margin-right:2px}.ox .o{color:var(--mint-koi)}.ox .x{color:#c4553a}
.coinedit{display:flex;gap:4px;align-items:center}
.coinedit input{width:4.5em;font:inherit;padding:6px;border:2px solid var(--sen);border-radius:8px;text-align:right}
.coinedit button{border:2px solid var(--sen);background:var(--kami);border-radius:8px;padding:4px 8px;font-weight:700}
.ttable select{font:inherit;padding:4px;border-radius:8px;border:2px solid var(--sen)}
.cam{width:min(480px,100%);border-radius:14px;background:#000}
.title-wrap{grid-template-columns:minmax(0,1fr);justify-items:center}.title-card{min-width:0}.logo small{overflow-wrap:anywhere}

</style>

  // あとから足した項目を、前の記録にも入れる
  Object.values(SAVE.players).forEach(p=>{
    if(p.partner===undefined) p.partner = null;
    if(p.yomiage===undefined) p.yomiage = false;
    if(!p.chiku) p.chiku = {opened:[1]};
    if(p.stopDan===undefined) p.stopDan = 0;            // 先生が止めた段階（③）
    if(!Array.isArray(p.settei)) p.settei = [];         // 読みこんだ せっていコードのID（③）

    if(!p.house) p.house = {};

    if(!p.house.room) p.house.room = {};
    if(!p.house.room.bg) p.house.room.bg = 'R1';
    if(!Array.isArray(p.house.room.items)) p.house.room.items = [];
  });
}

// ドラッグの共通のしくみ（マウスでも指でも）
function makeDraggable(el, targetSel, onDrop, onTap, onStart){
  el.addEventListener('pointerdown', e=>{
    if(e.button>0) return;
    e.preventDefault();
    const sx=e.clientX, sy=e.clientY, r=el.getBoundingClientRect();
    let ghost=null, over=null;
    const findTarget = (x,y)=>{ const t=document.elementFromPoint(x,y); return t ? t.closest(targetSel) : null; };
    const move = ev=>{
      if(!ghost && Math.hypot(ev.clientX-sx, ev.clientY-sy) > 8){
        ghost = el.cloneNode(true); ghost.classList.add('ghost'); ghost.classList.remove('sel','glow');
        Object.assign(ghost.style,{width:r.width+'px',height:r.height+'px',position:'fixed',zIndex:50,pointerEvents:'none',margin:0});
        document.body.appendChild(ghost); el.style.opacity=.3; if(onStart) onStart();
      }
      if(ghost){
        ghost.style.left=(ev.clientX-r.width/2)+'px'; ghost.style.top=(ev.clientY-r.height/2)+'px';
        const t = findTarget(ev.clientX, ev.clientY);
        if(t!==over){ if(over) over.classList.remove('over'); over=t; if(over) over.classList.add('over'); }
      }
    };
    const stop = ()=>{ window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', cancel); if(over) over.classList.remove('over'); };
    const up = ev=>{ stop();
      if(ghost){ ghost.remove(); el.style.opacity=''; onDrop(findTarget(ev.clientX, ev.clientY), ev); }
      else onTap(); };
    const cancel = ()=>{ stop(); if(ghost){ ghost.remove(); el.style.opacity=''; onDrop(null); } };
    window.addEventListener('pointermove', move); window.addEventListener('pointerup', up); window.addEventListener('pointercancel', cancel);
  });
}

// ==============================
let G = null;
function makeCounts(total, n, opt={}){
  // グループごとの数。opt.unique＝全部ちがう数 / opt.max＝1つの上限 / 最大はいつも1つだけ
  const mx = opt.max||8;
  for(let t=0;t<800;t++){
    const a = Array(n).fill(opt.min||1); let r = total - sum(a); if(r<0) break;
    for(;r>0;r--) a[rnd(n)]++;
    if(Math.max(...a)>mx) continue;
    const big = Math.max(...a), small = Math.min(...a);
    if(a.filter(v=>v===big).length!==1) continue;
    if(opt.uniqueMin && a.filter(v=>v===small).length!==1) continue;
    if(opt.unique && new Set(a).size!==n) continue;
    return a;
  }
  return null;
}
function pickKinds(st){
  const s = st.set;
  const pool = s.kinds || s.pick || DAIZAI[s.daizai].kinds.map(k=>k[0]);
  return s.kinds ? pool.slice() : shuffle(pool.slice()).slice(0, s.n);
}
function buildData(dan, st){
  const s = st.set; let cards=[], kinds=[], colors=[], vals=null, groupsKind=null, two=null;
  if(s.type==='kind' || (s.type==='choose' && s.correct==='kind')){
    kinds = pickKinds(st);
    let cnt;
    const needOrder = st.flow.includes('order');
    if(s.sonota){
      // 多いもの3つ（ちがう数・3以上）＋1〜2の少ないもの2つ（その他になる）
      for(let t=0;t<500;t++){
        const small=[1+rnd(2),1]; const main = makeCounts(st.cards - sum(small), 3, {min:3, max:8, unique:needOrder, uniqueMin:st.q.includes('least')});
        if(main){ cnt = main.concat(small); break; }
      }
      if(!cnt) cnt = [Math.max(3,st.cards-9), 4, 3, 1, 1];
    }else{
      cnt = makeCounts(st.cards, kinds.length, {max: dan===1?6:8, unique: needOrder || st.q.includes('least'), uniqueMin: st.q.includes('least')});
    }
    kinds.forEach((k,i)=>{ for(let j=0;j<cnt[i];j++) cards.push({kind:k}); });
    colors = [...new Set(kinds.map(k=>KIND[k][3]).filter(Boolean))];
    G.sonotaKinds = s.sonota ? kinds.slice(3) : [];
  }else if(s.type==='color' || s.type==='choose'){
    colors = s.colors.slice();
    const cnt = makeCounts(st.cards, colors.length, {max:6});
    colors.forEach((c,i)=>{ for(let j=0;j<cnt[i];j++){ const ks=IRO_KINDS[c]; cards.push({kind: ks[rnd(ks.length)]}); } });
    kinds = [...new Set(cards.map(c=>c.kind))];
  }else if(s.type==='data'){
    kinds = pickKinds(st);
    const step = s.step||1;
    for(let t=0;t<2000;t++){
      const a = kinds.map(()=> step*(1+rnd(Math.floor((s.vmax||10)/step))));
      const tot = sum(a);
      if(tot<s.sum[0] || tot>s.sum[1]) continue;
      if(new Set(a).size!==a.length) continue;
      vals = a; break;
    }
    if(!vals) vals = kinds.map((_,i)=>step*(i+1));
  }else if(s.type==='two'){
    kinds = pickKinds(st);
    for(let t=0;t<2000;t++){
      const m = kinds.map(()=>CLASSES.map(()=> s.cell[0]+rnd(s.cell[1]-s.cell[0]+1)));
      const c1 = m.map(r=>r[0]), c2 = m.map(r=>r[1]), rt = m.map(r=>r[0]+r[1]);
      const uniqMax = a=>a.filter(v=>v===Math.max(...a)).length===1;
      if(!uniqMax(c1) || !uniqMax(c2) || !uniqMax(rt)) continue;
      if(sum(c1)===sum(c2)) continue;
      two = m; break;
    }
    kinds.forEach((k,i)=>CLASSES.forEach((c,j)=>{ for(let x=0;x<two[i][j];x++) cards.push({kind:k, cls:c[0]}); }));
  }
  cards = shuffle(cards).map((c,i)=>({uid:'c'+i, kind:c.kind, color:KIND[c.kind][3], cls:c.cls}));
  Object.assign(G, {cards, kinds, colors, dataVals:vals, two});
}

// ==============================
// ステージのはじまり
// ==============================
function startStage(dan, s){
  const st = DAN[dan].stages[s-1];
  G = { dan, s, st, unit: st.unit || (st.set.daizai ? DAIZAI[st.set.daizai].unit : 'こ'),
        placed:{}, sel:null, glow:null, mark:false, marks:{}, flowIdx:0, t0:Date.now(), pkao:'futsu', pline:'',
        rec:{t:Date.now(), dan, stage:s, client:st.client, q:st.q.join('+'), kantenMiss:0, sortMiss:0, countUnder:0, countOver:0,
             tableMiss:0, orderMiss:0, graphMiss:0, titleMiss:0, help:{1:0,2:0,3:0}, helpFirstSec:null, qs:[]} };
  buildData(dan, st);
  G.kanten = st.set.type==='choose' ? null : (st.set.type==='color' ? 'color' : 'kind');
  if(st.set.type==='data'){
    G.groups = G.kinds.map(k=>({key:k, label:KIND[k][1], img:KIND[k][2]}));
    G.vals = {}; G.groups.forEach((g,i)=>G.vals[g.key]=G.dataVals[i]);
    G.hyoVals = Object.assign({}, G.vals); G.hyoDone = true; G.hyoTotal = sum(G.dataVals);
    G.colOrder = G.groups.map(g=>g.key);
    if(!st.flow.includes('graph')){ G.graph = Object.assign({}, G.vals); G.graphDone = true; G.titleText = st.title; }
  }else if(st.set.type==='two'){
    G.groups = G.kinds.map(k=>({key:k, label:KIND[k][1], img:KIND[k][2]}));
  }else if(G.kanten){
    G.groups = groupsFor(G.kanten);
  }
  if(G.groups && G.kanten) G.groups.forEach(g=>G.placed[g.key]=[]);
  // 「たりる？」の問題：ねらう種類と、いる数
  if(st.q.includes('enough')){
    const gk = G.kinds[rnd(G.kinds.length)]; const have = G.cards.filter(c=>c.kind===gk).length;
    G.target = gk; G.need = Math.max(1, have + [-1,0,1,1][rnd(4)]);
  }
  if(st.target) G.target = st.target;
  G.reqText = st.req.replace('{T}', G.target ? (IRO[G.target]?IRO[G.target][0]:KIND[G.target][1]) : '').replace('{N}', G.need||'');
  G.phase = st.flow[0];
  enterPhase();
}
function groupsFor(kanten){
  if(kanten==='color') return G.colors.map(c=>({key:c, label:IRO[c][0], iro:IRO[c][1]}));
  return G.kinds.map(k=>({key:k, label:KIND[k][1], img:KIND[k][2]}));
}
function groupOf(card){ return G.kanten==='color' ? card.color : card.kind; }
function gInfo(key){ return (G.rows||G.groups).find(g=>g.key===key) || G.groups.find(g=>g.key===key); }
function gLabel(g){ return g.img ? `<img src="${cardImg(g.img)}" alt="">${esc(g.label)}` : (g.iro ? `<span class="iro" style="background:${g.iro}"></span>${esc(g.label)}` : esc(g.label)); }
function countOf(key){ return G.vals ? G.vals[key] : G.placed[key].length; }

// 次の場面へ
function nextPhase(){
  G.flowIdx++; G.phase = G.st.flow[G.flowIdx]; G.pkao='futsu'; G.pline=''; G.mark=false; G.glow=null;
  enterPhase();
}
function enterPhase(){
  const ph = G.phase;
  if(ph==='kazoe'){ G.countIdx=0; }
  if(ph==='hyo'){
    // 表の行：その他があるときは、少ないものをまとめた行をつくる
    G.vals = {}; G.groups.forEach(g=>G.vals[g.key]=G.placed[g.key].length);
    if(G.sonotaKinds && G.sonotaKinds.length){
      const main = G.groups.filter(g=>!G.sonotaKinds.includes(g.key));
      G.rows = main.concat([{key:'sonota', label:'その他'}]);
      G.vals.sonota = sum(G.sonotaKinds.map(k=>G.vals[k]));
    }else G.rows = G.groups.slice();
    G.hyoVals = {}; G.hyoIdx = 0; G.hyoTotal = null;
  }
  if(ph==='hyo2'){
    G.cells = []; G.kinds.forEach((k,i)=>CLASSES.forEach((c,j)=>G.cells.push({k, c:c[0], j, v:G.two[i][j]})));
    G.kinds.forEach((k,i)=>G.cells.push({k, c:'tot', v:G.two[i][0]+G.two[i][1]}));
    G.cellVals = {}; G.cellIdx = 0;
  }
  if(ph==='order'){ G.orderList = []; }
  if(ph==='graph'){
    const rows = G.rows || G.groups;
    if(!G.colOrder) G.colOrder = rows.map(g=>g.key);
    G.graph = {}; G.colOrder.forEach(k=>G.graph[k]=0); G.badCols = [];
    if(!G.vals) G.vals = Object.assign({}, G.hyoVals);
  }
  if(ph==='title'){ G.titleOpts = shuffle([G.st.title+' しらべ'].concat(shuffle(TITLE_DECOY.slice()).slice(0,2))); }
  if(ph==='kotae'){ G.qs = G.st.q.map(makeQuestion); G.qIdx = 0; G.qStart = Date.now(); G.qTried = false; }
  showPlay();
}

// ==============================
// 問いをつくる
// ==============================
function mainRows(){ return (G.rows || G.groups).filter(g=>g.key!=='sonota'); }
function makeQuestion(type){
  const rows = mainRows(); const v = k=>G.vals[k]; const U = G.unit;
  const name = k=>gInfo(k).label;
  const allRows = G.rows || G.groups;
  if(type==='most'){ const k = rows.reduce((a,b)=>v(a.key)>=v(b.key)?a:b).key; return {type, text:'いちばん おおいのは どれ？', kind:'choice', opts:rows.map(g=>g.key), ans:k}; }
  if(type==='least'){ const k = rows.reduce((a,b)=>v(a.key)<=v(b.key)?a:b).key; return {type, text:'いちばん すくないのは どれ？', kind:'choice', opts:rows.map(g=>g.key), ans:k}; }
  if(type==='enough'){ const have=G.placed[G.target].length; return {type, text:`${KIND[G.target][1]}は ${G.need}${U} いるよ。たりる？`, kind:'yesno', ans: have>=G.need?'yes':'no'}; }
  if(type==='howmany'){ const k = G.target || rows[rnd(rows.length)].key; return {type, text:`${name(k)}は なん${U}？`.replace('なんこ','いくつ'), kind:'pad', ans:v(k), target:k}; }
  if(type==='total'){ return {type, text:`ぜんぶで なん${U}？`.replace('なんこ','いくつ'), kind:'pad', ans:sum(allRows.map(g=>v(g.key)))}; }
  if(type==='sonota'){ return {type, text:`「その他」は なん${U}？`.replace('なんこ','いくつ'), kind:'pad', ans:v('sonota')}; }
  if(type==='diff'){
    const s = shuffle(rows.slice()).slice(0,2).sort((a,b)=>v(b.key)-v(a.key));
    return {type, text:`${name(s[0].key)}は ${name(s[1].key)}より なん${U} おおい？`.replace('なんこ','いくつ'), kind:'pad', ans:v(s[0].key)-v(s[1].key), pair:[s[0].key,s[1].key]};
  }
  if(type==='statement'){
    const mx = rows.reduce((a,b)=>v(a.key)>=v(b.key)?a:b).key;
    const notMx = rows.filter(g=>g.key!==mx)[rnd(rows.length-1)].key;
    const s = shuffle(rows.slice()).slice(0,2).sort((a,b)=>v(b.key)-v(a.key)); const d = v(s[0].key)-v(s[1].key);
    const tot = sum(allRows.map(g=>v(g.key)));
    const cands = [
      [`${name(mx)}が いちばん おおい`, true], [`${name(notMx)}が いちばん おおい`, false],
      [`${name(s[0].key)}は ${name(s[1].key)}より ${d}${U} おおい`, true], [`${name(s[0].key)}は ${name(s[1].key)}より ${d+2}${U} おおい`, false],
      [`ぜんぶで ${tot}${U}`, true], [`ぜんぶで ${tot+3}${U}`, false]
    ];
    const t = rnd(3); const pickTrue = cands[t*2]; const falses = [0,1,2].filter(i=>i!==t).map(i=>cands[i*2+1]);
    const opts = shuffle([pickTrue].concat(falses));
    return {type, text:'グラフから わかる ことで、ただしいのは どれ？', kind:'text', opts:opts.map(o=>o[0]), ans:pickTrue[0]};
  }
  // 2つのクラス
  const ki = k=>G.kinds.indexOf(k);
  if(type==='cls_most'){ const j = rnd(2); const col = G.kinds.map(k=>G.two[ki(k)][j]); const k = G.kinds[col.indexOf(Math.max(...col))];
    return {type, text:`${CLASSES[j][1]}で いちばん おおいのは どれ？`, kind:'choice', opts:G.kinds.slice(), ans:k}; }
  if(type==='all_most'){ const rt = G.kinds.map(k=>sum(G.two[ki(k)])); const k = G.kinds[rt.indexOf(Math.max(...rt))];
    return {type, text:'2つの クラス あわせて いちばん おおいのは どれ？', kind:'choice', opts:G.kinds.slice(), ans:k}; }
  if(type==='row_total'){ const k = G.kinds[rnd(G.kinds.length)];
    return {type, text:`${KIND[k][1]}は 2つの クラス あわせて なん${U}？`.replace('なんこ','いくつ'), kind:'pad', ans:sum(G.two[ki(k)])}; }
  if(type==='cls_total'){ const j = rnd(2);
    return {type, text:`${CLASSES[j][1]}は ぜんぶで なん${U}？`.replace('なんこ','いくつ'), kind:'pad', ans:sum(G.two.map(r=>r[j]))}; }
}

function stepBar(){ const n = G.st.flow.length; return `<div class="step">${G.st.flow.map((_,i)=>`<i class="${i<=G.flowIdx?'on':''}"></i>`).join('')}</div>`; }

}
function iraiHtml(){
  const cl = clientInfo(G.st.client);
  let txt = esc(G.reqText);
  if(G.target && KIND[G.target]) txt = txt.replace(esc(KIND[G.target][1]), `<span class="need"><img src="${cardImg(KIND[G.target][2])}" alt="">${esc(KIND[G.target][1])}</span>`);

function boxHtml(g, cls='', num=null, markable=false){

// 表（1つの観点）
function hyoHtml(active){

    ${G.st.flow.includes('hyo') || G.st.set.type==='data' ? `<tr class="total"><th>ごうけい</th><td class="${active&&G.hyoIdx===rows.length?'on':''} ${tot!==null&&tot!==undefined?'ok':''}">${tot!==null&&tot!==undefined?tot:''}</td></tr>` : ''}
  </table></div>`;
}
// 2つのクラスの表
function hyo2Html(active){
  return `<div class="wrap-x"><table class="hyo"><caption>${esc(G.st.title)}（${esc(G.unit)}）</caption>
    <tr><th>しゅるい</th>${CLASSES.map(c=>`<th>${c[1]}</th>`).join('')}<th>ごうけい</th></tr>

  </table></div>`;
}
// ぼうグラフ
function graphHtml(edit){
  const rows = G.rows || G.groups;
  const order = G.colOrder || rows.map(g=>g.key);
  const sc = G.st.scale || 1;
  const vmax = Math.max(...order.map(k=>G.vals[k]));
  const nRows = Math.max(5, Math.ceil(vmax/sc/5)*5);
  const u = nRows>10 ? 20 : 26;
  const vals = G.graph || G.vals;
  return `<div class="graph" style="--u:${u}px;--rows:${nRows}">
    <div class="gt ${G.titleText?'':'empty'}">${G.titleText ? esc(G.titleText) : '（だいめい）'}</div>
    <div class="ggrid">
      <div class="yaxis" style="height:calc(${u}px * ${nRows})"><span class="yu">（${esc(G.unit)}）</span>
        ${Array.from({length:nRows},(_,i)=>`<span>${nRows<=10 || (i+1)%2===0 ? (i+1)*sc : ''}</span>`).join('')}</div>
      <div class="plot">${order.map(k=>{ const n = Math.round(vals[k]/sc);
        return `<button class="col ${edit?'can':''} ${(G.badCols||[]).includes(k)?'bad':''}" data-col="${k}" ${edit?'':'tabindex="-1"'} aria-label="${esc(gInfo(k).label)}">${'<i class="blk"></i>'.repeat(n)}</button>`; }).join('')}</div>
      <div></div>
      <div class="xlabels">${order.map(k=>`<div>${gInfo(k).img?`<img src="${cardImg(gInfo(k).img)}" alt="">`:''}${esc(gInfo(k).label)}</div>`).join('')}</div>
      ${edit?`<div></div><div class="minus">${order.map(k=>`<button data-minus="${k}" aria-label="${esc(gInfo(k).label)}を へらす">−</button>`).join('')}</div>`:''}
    </div>
  </div>`;
}

      : G.st.flow.includes('hyo') ? hyoHtml(false)
      : `<div class="boxes" style="--n:${G.groups.length}">${G.groups.map(gg=>boxHtml(gg, 'ok'+(G.target===gg.key?' target':''), G.placed[gg.key].length)).join('')}</div>`;
    const opts = q.kind==='choice' ? `<div class="choices">${q.opts.map(k=>{ const g = gInfo(k) || {label:KIND[k][1], img:KIND[k][2]};
        return `<button data-k="${k}">${g.img?`<img src="${cardImg(g.img)}" alt="">`:(g.iro?`<span class="iro" style="background:${g.iro}"></span>`:'')}${esc(g.label)}</button>`; }).join('')}</div>`
      : q.kind==='yesno' ? `<div class="choices"><button data-k="yes" style="font-size:1.5rem">たりる</button><button data-k="no" style="font-size:1.5rem">たりない</button></div>`
      : q.kind==='text' ? `<div class="choices text">${q.opts.map(t=>`<button data-k="${esc(t)}">${esc(t)}</button>`).join('')}</div>`
      : padHtml(Math.max(q.ans, 10), 'a');
    body = `<div class="work one">${show}</div>
      ${G.qs.length>1?`<div class="qcount">しつもん ${G.qIdx+1} / ${G.qs.length}</div>`:''}
      <div class="msg" id="msg">${esc(q.text)}</div>${opts}`;
  }
  $app.innerHTML = head + `<div class="play">${iraiHtml()}${body}</div>`;
  bindPlay();
}
function say(t, kao){ const m=document.getElementById('msg'); if(m) m.textContent=t; if(kao) partnerSays(kao,''); }
function partnerSays(kao, line){
  G.pkao = kao; G.pline = line;
  const im=document.getElementById('pimg'); if(im) im.src=seiImg(me().partner,kao);
  const pl=document.getElementById('pline'); if(pl) pl.textContent=line;
}
function shake(el){ if(!el) return; el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
function useHelp(n){ G.rec.help[n]++; if(G.rec.helpFirstSec===null) G.rec.helpFirstSec = Math.round((Date.now()-G.t0)/1000); }
function oops(line, msg, el){ partnerSays('komatta', line); say(msg); shake(el); }

function bindPlay(){
  $app.querySelector('#quit').onclick = ()=>endStage(false);
  $app.querySelector('#hint').onclick = onHint;
  const ph = G.phase;
  if(ph==='kanten'){
    $app.querySelectorAll('[data-kanten]').forEach(b=>b.onclick=()=>{
      if(b.dataset.kanten===G.st.set.correct){
        G.kanten = b.dataset.kanten; G.groups = groupsFor(G.kanten); G.groups.forEach(g=>G.placed[g.key]=[]);
        nextPhase(); partnerSays('ouen','いい わけかた！');
      }else{
        G.rec.kantenMiss++; b.classList.add('bad');
        oops('それだと こまるかも', G.st.set.correct==='color' ? 'しゅるいで わけると、おなじ いろが ばらばらに なっちゃうよ' : 'いろで わけると、ちがう くだものが まざっちゃうよ', b);
      }
    });
  }else if(ph==='wake'){
    $app.querySelectorAll('[data-c]').forEach(el=>{
      makeDraggable(el, '[data-box]', bx=>{ if(bx) dropTo(el.dataset.c, bx.dataset.box); },
        ()=>{ G.sel = (G.sel===el.dataset.c) ? null : el.dataset.c; showPlay(); });
      el.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ G.sel=el.dataset.c; showPlay(); }});
    });
    $app.querySelectorAll('[data-box]').forEach(bx=>{
      const go=()=>{ if(!G.sel){ say('さきに カードを えらんでね'); return; } dropTo(G.sel, bx.dataset.box); };
      bx.addEventListener('click', go);
      bx.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' ') go(); });
    });
  }else if(ph==='kazoe' || ph==='hyo'){
    if(ph==='kazoe') $app.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>answerCount(+b.dataset.n));
    else $app.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>answerHyo(+b.dataset.h, b));
    if(G.mark) $app.querySelectorAll('.box.on [data-m]').forEach(m=>m.onclick=e=>{ e.stopPropagation();
      const arr = G.marks[m.dataset.g] = G.marks[m.dataset.g]||[]; const i = arr.indexOf(m.dataset.m);
      if(i>=0) arr.splice(i,1); else arr.push(m.dataset.m); showPlay(); });
  }else if(ph==='hyo2'){
    $app.querySelectorAll('[data-h2]').forEach(b=>b.onclick=()=>answerHyo2(+b.dataset.h2, b));
    $app.querySelectorAll('[data-m2]').forEach(m=>m.onclick=()=>{ if(!G.mark) return;
      const arr = G.marks[m.dataset.cl] = G.marks[m.dataset.cl]||[]; const i = arr.indexOf(m.dataset.m2);
      if(i>=0) arr.splice(i,1); else arr.push(m.dataset.m2); showPlay(); });
  }else if(ph==='order'){
    $app.querySelectorAll('[data-ord]').forEach(b=>b.onclick=()=>{
      const rest = mainRows().filter(g=>!G.orderList.includes(g.key));
      const best = rest.reduce((a,c)=>G.vals[a.key]>=G.vals[c.key]?a:c).key;
      if(b.dataset.ord===best){
        G.orderList.push(best); G.glow=null;
        if(G.orderList.length===mainRows().length){
          G.colOrder = G.orderList.concat(G.rows.some(g=>g.key==='sonota')?['sonota']:[]);
          nextPhase(); partnerSays('ureshii','きれいに ならんだね');
        }else showPlay();
      }else{ G.rec.orderMiss++; oops('あれれ？','のこりの なかで いちばん おおいのは どれかな？ ひょうを みてね', b); }
    });
  }else if(ph==='graph'){
    const sc = G.st.scale||1;
    const vmax = Math.max(...G.colOrder.map(k=>G.vals[k])); const cap = Math.max(5, Math.ceil(vmax/sc/5)*5)*sc;
    $app.querySelectorAll('[data-col]').forEach(b=>b.onclick=()=>{ const k=b.dataset.col; if(G.graph[k]+sc<=cap){ G.graph[k]+=sc; G.badCols=G.badCols.filter(x=>x!==k); showPlay(); } });
    $app.querySelectorAll('[data-minus]').forEach(b=>b.onclick=()=>{ const k=b.dataset.minus; if(G.graph[k]>0){ G.graph[k]-=sc; showPlay(); } });
    $app.querySelector('#gdone').onclick = ()=>{
      const bad = G.colOrder.filter(k=>G.graph[k]!==G.vals[k]);
      if(!bad.length){ G.graphDone=true; nextPhase(); partnerSays('ureshii','すてきな グラフ！'); }
      else{ G.rec.graphMiss++; G.badCols = bad; showPlay(); oops('もうすこし！', `いろが ついた ぼうの たかさを、ひょうと くらべてみよう`); }
    };
  }else if(ph==='title'){
    $app.querySelectorAll('[data-title]').forEach(b=>b.onclick=()=>{
      if(b.dataset.title===G.st.title+' しらべ'){ G.titleText=b.dataset.title; nextPhase(); partnerSays('ureshii','ぴったりの だいめい！'); }
      else{ G.rec.titleMiss++; b.classList.add('bad'); oops('うーん','グラフに かいてある ものと あっているかな？', b); }
    });
  }else if(ph==='kotae'){
    $app.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>answerQ(b, b.dataset.k));
    $app.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>answerQ(b, +b.dataset.a));
  }
}

// ヒント：場面ごとに、パートナーが手助けする
function onHint(){
  const ph = G.phase;
  if(ph==='kanten'){ partnerSays('ouen','おねがいの ことばを もういちど よんでみてね'); return; }
  if(ph==='wake'){
    useHelp(2);   // 手助け2：同じなかまが光る
    const used = Object.values(G.placed).flat();
    const base = G.sel ? G.cards.find(c=>c.uid===G.sel) : G.cards.find(c=>!used.includes(c.uid));
    if(!base) return;
    G.glow = groupOf(base); G.pkao='ouen'; G.pline='ひかっているのが おなじ なかまだよ'; showPlay(); return;
  }
  if(ph==='kazoe' || ph==='hyo' || ph==='hyo2'){
    useHelp(1);   // 手助け1：数えたものに印
    G.mark = true; if(ph==='hyo2') G.glow = true;
    G.pkao='ouen'; G.pline = ph==='hyo2' ? 'ひかっている カードを タップして かぞえよう' : 'ひとつずつ タップして かぞえよう'; showPlay(); return;
  }
  if(ph==='order'){
    useHelp(2);
    const rest = mainRows().filter(g=>!G.orderList.includes(g.key));
    G.glow = rest.reduce((a,c)=>G.vals[a.key]>=G.vals[c.key]?a:c).key; G.pkao='ouen'; G.pline='ひかっているのが いちばん おおいよ'; showPlay(); return;
  }
  if(ph==='graph'){
    useHelp(3);
    const sc = G.st.scale||1;
    partnerSays('ouen', sc>1 ? `1かい タップで ${sc}${G.unit} ふえるよ。${G.vals[G.colOrder[0]]}なら ${G.vals[G.colOrder[0]]/sc}かいだね` : 'ひょうの かずと おなじ かずだけ タップしよう'); return;
  }
  if(ph==='title'){ partnerSays('ouen','なにを しらべた グラフか かんがえよう'); return; }
  if(ph==='kotae'){
    useHelp(3);
    const q = G.qs[G.qIdx];
    const line = {most:'いちばん たかい ぼう（いちばん 大きい かず）を さがそう', least:'いちばん ひくい ぼう（いちばん 小さい かず）を さがそう',
      enough:'いる かずと、ある かずを くらべよう', howmany:'ぼうの てっぺんから よこに たどって、めもりを よもう',
      total:'ぜんぶの かずを たそう', sonota:'その他の かずを みてね', diff:'2つの かずの ちがいは、おおい ほうから すくない ほうを ひくよ',
      statement:'1つずつ グラフと くらべて たしかめよう', cls_most:'その クラスの たての れつを みよう', all_most:'ごうけいの れつを みよう',
      row_total:'2つの クラスの かずを たそう', cls_total:'その クラスの かずを ぜんぶ たそう'}[q.type];
    partnerSays('ouen', line);
  }
}

// 分ける
function dropTo(uid, boxKey){
  const card = G.cards.find(c=>c.uid===uid); if(!card) return;
  if(groupOf(card)!==boxKey){
    G.rec.sortMiss++; G.sel=null; G.pkao='komatta'; G.pline='あれれ？'; showPlay();
    say('ちがう なかまの はこ みたい。もういちど'); shake($app.querySelector(`[data-box="${boxKey}"]`)); return; }
  G.placed[boxKey].push(uid); G.sel=null;
  if(G.glow && !G.cards.some(c=>groupOf(c)===G.glow && !Object.values(G.placed).flat().includes(c.uid))) G.glow=null;
  G.pkao='futsu'; G.pline='';
  const allIn = Object.values(G.placed).flat().length===G.cards.length;
  showPlay();
  if(allIn){ say('ぜんぶ わけられた！','ureshii'); setTimeout(()=>{ if(G && G.phase==='wake') nextPhase(); }, 900); }
}
// 数える（だい1だん）
function answerCount(n){
  const g = G.groups[G.countIdx]; const right = G.placed[g.key].length;
  if(n===right){
    G.countIdx++; G.pkao='ureshii'; G.pline='';
    if(G.countIdx>=G.groups.length){ G.vals={}; G.groups.forEach(gg=>G.vals[gg.key]=G.placed[gg.key].length); nextPhase(); }
    else{ showPlay(); say(`せいかい！ ${G.groups[G.countIdx].label}の はこは いくつ？`); }
  }else{
    if(n<right) G.rec.countUnder++; else G.rec.countOver++;
    oops('もういちど かぞえよう', n<right ? 'もうすこし ありそう。ゆびで さしながら かぞえてみよう' : 'すこし おおいかも。ゆびで さしながら かぞえてみよう', $app.querySelector('.box.on'));
  }
}
// 表にかく（だい2・3だん）
function answerHyo(n, btn){
  const rows = G.rows;
  if(G.hyoIdx < rows.length){
    const r = rows[G.hyoIdx];
    if(n===G.vals[r.key]){ G.hyoVals[r.key]=n; G.hyoIdx++; G.pkao='ureshii'; G.pline=''; G.mark=false; showPlay(); }
    else{ G.rec.tableMiss++; if(n<G.vals[r.key]) G.rec.countUnder++; else G.rec.countOver++;
      oops('もういちど', r.key==='sonota' ? 'その他に まとめる ものを、ぜんぶ たしてみよう' : 'はこの カードを もういちど かぞえよう', btn); }
  }else{
    const tot = sum(rows.map(g=>G.vals[g.key]));
    if(n===tot){ G.hyoTotal=tot; nextPhase(); partnerSays('ureshii','ひょうが できたね！'); }
    else{ G.rec.tableMiss++; oops('もういちど','ひょうの かずを ぜんぶ たしてみよう', btn); }
  }
}
function answerHyo2(n, btn){
  const cell = G.cells[G.cellIdx];
  if(n===cell.v){ G.cellVals[G.cellIdx]=n; G.cellIdx++; G.mark=false; G.glow=null; G.pkao='ureshii'; G.pline='';
    if(G.cellIdx>=G.cells.length){ G.vals={}; G.kinds.forEach((k,i)=>G.vals[k]=G.two[i][0]+G.two[i][1]); nextPhase(); partnerSays('ureshii','ひとつの ひょうに まとまったね！'); }
    else showPlay(); }
  else{ G.rec.tableMiss++; oops('もういちど', cell.c==='tot' ? '1くみと 2くみの かずを たそう' : 'その クラスの カードを もういちど かぞえよう', btn); }
}
// 答える
function answerQ(btn, val){
  const q = G.qs[G.qIdx];
  const ok = q.kind==='pad' ? val===q.ans : val===q.ans;
  if(!G.qTried){ G.rec.qs.push({type:q.type, ok, sec:Math.round((Date.now()-G.qStart)/100)/10}); G.qTried = true; }
  if(ok){
    G.qIdx++; G.qTried=false; G.qStart=Date.now();
    if(G.qIdx>=G.qs.length){ endStage(true); return; }
    G.pkao='ureshii'; G.pline='せいかい！'; showPlay(); return;
  }
  btn.classList.add('bad');
  oops('', q.type==='enough' ? `はこには ${G.placed[G.target].length}こ。いるのは ${G.need}こ。くらべてみよう` : 'もういちど よく みてみよう', btn);
}

// ==============================
// ステージのおわり：記録・コイン・建物・つぎの地区
// ==============================
function endStage(cleared){
  const p = me(); const key = `${G.dan}-${G.s}`;
  const first = cleared && !(p.cleared[key]>0);
  const okN = G.rec.qs.filter(x=>x.ok).length;
  const rec = Object.assign({}, G.rec, {result: cleared?'clear':'quit', sec: Math.round((Date.now()-G.rec.t)/1000),
    readOk: G.rec.qs.length ? okN===G.rec.qs.length : null, readRate: G.rec.qs.length ? Math.round(okN/G.rec.qs.length*100) : null,
    vals: G.vals || null, kanten: G.kanten});
  addLog(rec);
  let gain = 0, newB = null, newChiku = null, stopHere = false;
  if(cleared){
    p.cleared[key] = (p.cleared[key]||0) + 1;
    gain = SETTEI.coinClear + (first ? SETTEI.coinFirstBonus : 0); p.coins += gain;
    const b = CHIKU[G.dan-1].reward[G.s-1];
    if(first && !p.owned.includes(b)){ p.owned.push(b); newB = b; }
    if(G.s===DAN[G.dan].stages.length && G.dan<5 && !p.chiku.opened.includes(G.dan+1)){
      if(danAllowed(p, G.dan+1)){ p.chiku.opened.push(G.dan+1); newChiku = G.dan+1; } else stopHere = true; }
  }
  writeSave();
  if(!cleared){ const d=G.dan; G=null; showStages(d); return; }
  const cl = clientInfo(G.st.client);
  $app.innerHTML = `<div class="clear"><div class="panel">
    <div class="big">おねがい かなえた！</div>
    <div class="pair"><img src="${cl.img}" alt=""><img src="${seiImg(p.partner,'ureshii')}" alt=""></div>
    <p style="font-weight:700;font-size:1.2rem">${esc(cl.name)}「ありがとう！ たすかったよ」</p>
    <div class="coinline"><img src="${COIN}" alt="">＋${gain}${first?'<span class="sub-msg">（はじめての ボーナス こみ）</span>':''}</div>
    ${newB ? `<img class="reward" src="${tateImg(newB)}" alt=""><h2>${esc(TATEMONO[newB][0])}を もらった！</h2>
      <button class="btn" id="put">まちに おく</button>` : '<p class="sub-msg">たてものは もう もっているよ</p>'}
    ${stopHere ? '<p class="newchiku">つぎの まちは、せんせいと いっしょに ひらこう</p>' : ''}
    ${newChiku ? `<p class="newchiku">あたらしい まち「${esc(CHIKU[newChiku-1].name)}」が ひらいた！</p>` : ''}
    <div class="bar" style="justify-content:center"><button class="btn sub" id="again">もういちど</button><button class="btn sub" id="list">ステージえらび</button></div>
  </div></div>`;
  const dan = G.dan, s = G.s; G=null;
  const put = $app.querySelector('#put'); if(put) put.onclick=()=>{ curChiku=dan; pickId=newB; pickFrom=null; showTown(); };
  $app.querySelector('#again').onclick=()=>startStage(dan, s);
  $app.querySelector('#list').onclick=()=>showStages(newChiku||dan);
}

const TSETTEI = {
  teacherKey: 'kazoete-town_teacher_v1',     // 先生の端末に ためる 記録の保存の名前（変えない）
  passSalt: 'kazoete-town:',                 // あいことばに まぜる 文字
  passDefaultHash: 'f2bc89a26a56f491a7698fe515aa61b2b871f23a2d7930d4f34309abb602438a',  // さいしょの あいことば「kazoe」
  pageUrl: 'https://rubiziumu37-glitch.github.io/kazoete-town/',   // せっていQRに入れる アドレス
  kirokuMax: 200,                            // きろくコード（文字）に入れる 回数
  teacherLogMax: 1000                        // 先生の端末に 1人あたり ためる 回数
};
// 問題の種類の よみかた
const QLABEL = {
  most:'いちばん おおい', least:'いちばん すくない', enough:'たりる？', howmany:'いくつ（1つの数）', total:'ぜんぶで',
  sonota:'「その他」の数', diff:'ちがい（いくつ おおい）', statement:'ただしい文を えらぶ',
  cls_most:'クラスで いちばん おおい', all_most:'あわせて いちばん おおい', row_total:'あわせて いくつ（2つのクラス）', cls_total:'クラスの ぜんぶ'
};

// ---- コードの 作り方：JSON → 縮める（deflate） → URLに 入れられる文字 ----
function b64u(bytes){ let s=''; bytes.forEach(b=>s+=String.fromCharCode(b)); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function unb64u(t){ t=t.replace(/-/g,'+').replace(/_/g,'/'); while(t.length%4) t+='='; const s=atob(t); return Uint8Array.from(s, c=>c.charCodeAt(0)); }
async function streamBytes(bytes, stream){ const r = new Blob([bytes]).stream().pipeThrough(stream); return new Uint8Array(await new Response(r).arrayBuffer()); }
async function packCode(prefix, obj){
  const raw = new TextEncoder().encode(JSON.stringify(obj));
  if(window.CompressionStream){ try{ return prefix + 'Z' + b64u(await streamBytes(raw, new CompressionStream('deflate-raw'))); }catch(e){} }
  return prefix + 'J' + b64u(raw);
}
// 貼られた文の中から コードを ぜんぶ 見つける（何人分でも）
function findCodes(text, prefix){ const re = new RegExp(prefix + '[ZJ][A-Za-z0-9_-]+', 'g'); return String(text).match(re) || []; }
async function unpackCode(code, prefix){
  const body = code.slice(prefix.length + 1), flag = code[prefix.length];
  let bytes = unb64u(body);
  if(flag==='Z') bytes = await streamBytes(bytes, new DecompressionStream('deflate-raw'));
  return JSON.parse(new TextDecoder().decode(bytes));
}
async function hashPass(t){
  const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(TSETTEI.passSalt + String(t).trim()));
  return Array.from(new Uint8Array(d)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function qrSvg(text){
  try{ const q = qrcode(0, 'L'); q.addData(text); q.make(); return q.createSvgTag({cellSize:4, margin:3, scalable:true}); }
  catch(e){ return '<p class="sub-msg">QRが つくれませんでした（文字の コードを つかってね）</p>'; }
}
async function copyText(t, btn){
  let ok = false;
  try{ await navigator.clipboard.writeText(t); ok = true; }catch(e){}
  if(!ok){ const ta = btn.closest('.panel').querySelector('textarea'); if(ta){ ta.focus(); ta.select(); try{ ok = document.execCommand('copy'); }catch(e){} } }
  btn.textContent = ok ? 'コピーした！' : 'えらんだので、コピーしてね';
}

// ---- 子ども：止める段階 ----
function danAllowed(p, dan){ return p.teacher || !p.stopDan || dan <= p.stopDan; }
// 8つ かなえた 段階の つぎの町を、止められていなければ ひらく
function syncOpen(p){
  for(let d=1; d<5; d++){
    const all = DAN[d].stages.every((_,k)=>(p.cleared[`${d}-${k+1}`]||0)>0);
    if(all && danAllowed(p, d+1) && !p.chiku.opened.includes(d+1)) p.chiku.opened.push(d+1);
  }
  p.chiku.opened.sort((a,b)=>a-b);
}

// ---- 子ども：せっていコードを 入れる ----
async function applySetteiText(text){
  const codes = findCodes(text, 'KZS1');
  if(!codes.length) return ['せっていコードが みつからないよ'];
  const out = [];
  for(const c of codes){
    let d; try{ d = await unpackCode(c, 'KZS1'); }catch(e){ out.push('コードが こわれているよ'); continue; }
    Object.entries(d.k||{}).forEach(([no, v])=>{
      const p = SAVE.players[no]; if(!p || p.teacher) return;
      const [stop, coin] = v; const msg = [];
      p.stopDan = stop||0;
      msg.push(stop ? `だい${stop}だんまで` : 'とめる だんかい なし');
      if(coin && !p.settei.includes(d.id)){ p.coins = Math.max(0, p.coins + coin); msg.push(`コイン ${coin>0?'＋':''}${coin}`); }
      if(!p.settei.includes(d.id)) p.settei.push(d.id);
      if(p.settei.length > 50) p.settei.splice(0, p.settei.length - 50);
      syncOpen(p);
      out.push(`${no}ばん ${p.nick}：${msg.join('　')}`);
    });
  }
  writeSave();
  return out.length ? out : ['この たんまつに いる ばんごうは コードに はいって いなかったよ'];
}

// ---- 子ども：きろくコード ----
function lastProgress(p){
  let best = null;
  Object.keys(p.cleared).forEach(k=>{ const [d,s] = k.split('-').map(Number); if(!best || d*10+s > best[0]*10+best[1]) best=[d,s]; });
  return best ? `${best[0]}-${best[1]}` : '';
}
function qStats(logs){
  const q = {};
  logs.forEach(r=>(r.qs||[]).forEach(x=>{ q[x.type] = q[x.type] || [0,0]; q[x.type][1]++; if(x.ok) q[x.type][0]++; }));
  return q;
}
function recentRate(logs, n=10){
  const all = []; logs.forEach(r=>(r.qs||[]).forEach(x=>all.push(x.ok)));
  const last = all.slice(-n); return last.length ? Math.round(last.filter(Boolean).length / last.length * 100) : null;
}
function kidSummary(p){
  const last = p.log.length ? p.log[p.log.length-1].t : null;
  return {v:1, no:p.no, nick:p.nick, coins:p.coins, cl:Object.keys(p.cleared).length, pr:lastProgress(p), t:last, r10:recentRate(p.log), q:qStats(p.log), stop:p.stopDan||0};
}
function showMiseru(){
  const p = me();
  const d = document.createElement('div'); d.className = 'modal';
  d.innerHTML = `<div class="panel miseru"><h2>せんせいに みせる</h2><p class="sub-msg">つくっています…</p></div>`;
  document.body.appendChild(d);
  (async ()=>{
    const sum = kidSummary(p);
    const qr = await packCode('KZQ1', sum);
    const full = await packCode('KZK1', Object.assign({}, sum, {full:1, opened:p.chiku.opened, cleared:p.cleared, log:p.log.slice(-TSETTEI.kirokuMax)}));
    d.innerHTML = `<div class="panel miseru">
      <h2>せんせいに みせる</h2>
      <div class="qr">${qrSvg(qr)}</div>
      <p class="sub-msg">${p.no}ばん ${esc(p.nick)}　せんせいの カメラで よんでもらってね</p>

let TS = null;
function loadTS(){
  try{ TS = JSON.parse(localStorage.getItem(TSETTEI.teacherKey)||'null'); }catch(e){ TS = null; }
  if(!TS || typeof TS!=='object') TS = {};
  if(!TS.kids) TS.kids = {};
  if(!TS.edit) TS.edit = {};
  if(!TS.passHash) TS.passHash = null;
}
function writeTS(){ try{ localStorage.setItem(TSETTEI.teacherKey, JSON.stringify(TS)); }catch(e){} }
// 子どもの きろくを 先生の 端末に まぜる（同じ記録は 二重に しない）
function mergeKid(d){
  const no = String(d.no); if(!/^\d+$/.test(no)) return null;
  const k = TS.kids[no] = TS.kids[no] || {logs:[]};
  if(!k.t || (d.t||0) >= k.t){ ['nick','coins','cl','pr','t','r10','q','stop'].forEach(f=>{ if(d[f]!==undefined) k[f]=d[f]; }); }
  if(d.full && Array.isArray(d.log)){
    const seen = new Set(k.logs.map(r=>r.t+'|'+r.dan+'|'+r.stage));
    d.log.forEach(r=>{ const key=r.t+'|'+r.dan+'|'+r.stage; if(!seen.has(key)){ k.logs.push(r); seen.add(key); } });
    k.logs.sort((a,b)=>a.t-b.t);
    if(k.logs.length > TSETTEI.teacherLogMax) k.logs.splice(0, k.logs.length - TSETTEI.teacherLogMax);
    k.fullAt = Date.now();
  }
  k.readAt = Date.now();
  return no;
}
async function readKirokuText(text){
  const out = [];
  for(const pre of ['KZK1','KZQ1']){
    for(const c of findCodes(text, pre)){
      try{ const d = await unpackCode(c, pre); const no = mergeKid(d); out.push(no ? `${no}ばん ${d.nick}（${pre==='KZK1'?'くわしい きろく '+(d.log||[]).length+'回':'QRの まとめ'}）` : 'ばんごうが ない コード'); }
      catch(e){ out.push('こわれた コードが ありました'); }
    }
  }
  writeTS();
  return out;
}

let camStream = null, camTimer = null;

function loadJsQR(){
  return new Promise((ok,ng)=>{ if(window.jsQR) return ok(); const s=document.createElement('script'); s.src='lib/jsQR.min.js'; s.onload=ok; s.onerror=ng; document.head.appendChild(s); });

async function startCamera(wrap, onText){
  stopCamera();
  wrap.innerHTML = '<p class="sub-msg">カメラを じゅんび しています…</p>';
  try{ camStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}, audio:false}); }
  catch(e){ wrap.innerHTML = '<p class="err">カメラが つかえませんでした。もじの コードで 読みこんでください。</p>'; return; }
  wrap.innerHTML = '<video playsinline muted class="cam"></video><div class="bar"><button class="btn sub small" id="camstop">カメラを とじる</button><span class="sub-msg" id="camst">QRを うつしてください</span></div>';
  const v = wrap.querySelector('video'); v.srcObject = camStream; await v.play().catch(()=>{});
  wrap.querySelector('#camstop').onclick = ()=>{ stopCamera(); wrap.innerHTML=''; };
  let det = null;
  try{ if('BarcodeDetector' in window && (await BarcodeDetector.getSupportedFormats()).includes('qr_code')) det = new BarcodeDetector({formats:['qr_code']}); }catch(e){}
  if(!det){ try{ await loadJsQR(); }catch(e){ wrap.querySelector('#camst').textContent='QRを よむ しくみが 読みこめませんでした'; return; } }
  const cv = document.createElement('canvas'), cx = cv.getContext('2d', {willReadFrequently:true});
  const seen = new Set();
  const tick = async ()=>{
    if(!camStream) return;
    let text = null;
    try{
      if(v.videoWidth){
        if(det){ const r = await det.detect(v); if(r[0]) text = r[0].rawValue; }
        else { cv.width = v.videoWidth; cv.height = v.videoHeight; cx.drawImage(v,0,0); const im = cx.getImageData(0,0,cv.width,cv.height); const r = jsQR(im.data, im.width, im.height); if(r) text = r.data; }
      }
    }catch(e){}
    if(text && !seen.has(text)){ seen.add(text); const st = wrap.querySelector('#camst'); if(st) st.textContent = 'よみこみました！ つぎの QRを うつしてください'; await onText(text); }
    camTimer = setTimeout(tick, 250);
  };
  tick();
}

// 「だい dan だんの stage こめまで かなえた」ことに して、コインを coins まいに する。
// 記録は 足すだけ：前から ある クリアや 建物は 消さない。買ったもの・家・置いた場所は さわらない。
function modosuKid(no, nick, dan, stage, coins){
  let p = SAVE.players[no], isNew = false;
  if(!p){ p = SAVE.players[no] = newPlayer(no, nick); isNew = true; }
  p.nick = nick;
  for(let d=1; d<=dan; d++){
    const n = (d<dan) ? DAN[d].stages.length : stage;
    for(let s=1; s<=n; s++){
      const key = `${d}-${s}`;
      if(!(p.cleared[key]>0)) p.cleared[key] = 1;
      const b = CHIKU[d-1].reward[s-1];              // その おねがいで もらえる 建物（置くのは 子ども）
      if(b && !p.owned.includes(b)) p.owned.push(b);
    }
    if(!p.chiku.opened.includes(d)) p.chiku.opened.push(d);
  }
  syncOpen(p);                                        // 8つ かなえた 段階の つぎの町を ひらく
  p.coins = coins;
  p.modoshi = {t: Date.now(), dan, stage, coins};     // 先生が もどした しるし（あとで 見返す ため）
  writeSave();
  return isNew;
}

  };
  const mDisarm = ()=>{ mArmed = ''; mq('#m-go').textContent = 'この 端末に もどす'; };
  ['#m-no','#m-nick','#m-dan','#m-st','#m-coin'].forEach(id=>{ mq(id).oninput = mDisarm; mq(id).onchange = mDisarm; });
  // 先生画面に あつめて ある きろく（一覧の 中身）から、進みと コインを 入れる
  mq('#m-fill').onclick = ()=>{
    const no = parseInt(zen2han(mq('#m-no').value),10), k = TS.kids[no];
    mDisarm();
    if(!(no>=1 && no<=99)) return mSay('先に ばんごうを 入れてください');
    if(!k) return mSay(`${no}ばんの きろくは、この 端末の 先生画面に ありません。手で 入れてください`);
    if(k.nick) mq('#m-nick').value = k.nick;
    const m = /^(\d)-(\d)$/.exec(k.pr||'');
    if(m){ mq('#m-dan').value = m[1]; mq('#m-st').value = m[2]; }
    if(k.coins!=null) mq('#m-coin').value = k.coins;
    mSay(`${no}ばんの きろく（${fmtDay(k.t)}）から 入れました。たしかめてから「この 端末に もどす」を おして ください`, true);
  };
  mq('#m-go').onclick = ()=>{
    const v = mRead(); if(!v) return mDisarm();
    const sig = JSON.stringify(v), old = SAVE.players[v.no];
    if(mArmed !== sig){                               // 1回目：なにが おきるかを 見せて たしかめる
      mArmed = sig; mq('#m-go').textContent = 'もう いちど おすと もどします';
      const where = `だい${v.dan}だん${v.stage ? ' '+v.stage+'こめまで' : 'の はじめ'}`;
      return mSay(old
        ? `${v.no}ばん（${old.nick}）は この 端末に もう あります。コインを ${old.coins} → ${v.coins} に 直し、進みを「${where}」まで 足します（進みが へる ことは ありません。買ったもの・家は そのまま）`
        : `${v.no}ばん ${v.nick} を、「${where}」・コイン ${v.coins} で この 端末に 作ります`, true);
    }
    const isNew = modosuKid(v.no, v.nick, v.dan, v.stage, v.coins);
    mDisarm();
    mSay(`${v.no}ばん ${v.nick} を ${isNew ? '作りました' : '直しました'}。「おわる」→「つづきから」の ${v.no}ばんで はじめられます`, true);
  };
  box.querySelector('#try').onclick = ()=>{
    let p = SAVE.players.sensei;
    if(!p){ p = SAVE.players.sensei = newPlayer('sensei', 'せんせい'); p.teacher = true; p.partner = 'shizuku'; p.coins = 3000; }
    p.chiku.opened = [1,2,3,4,5];
    SAVE.last = 'sensei'; writeSave(); curChiku = 1; showTown();
  };
  box.querySelector('#pch').onclick = async ()=>{
    const a = box.querySelector('#p1').value.trim(), b = box.querySelector('#p2').value.trim(), er = box.querySelector('#perr');
    if(a.length < 4){ er.textContent = '4文字 以上に してください'; return; }
    if(a !== b){ er.textContent = '2つが ちがいます'; return; }
    TS.passHash = await hashPass(a); writeTS(); er.textContent = 'かえました'; er.style.color = 'var(--mint-koi)';
  };
  const w = box.querySelector('#wipe'); let armed = false;
  w.onclick = ()=>{ if(!armed){ armed = true; w.textContent = 'もう いちど おすと けします'; return; } TS.kids = {}; TS.edit = {}; writeTS(); w.textContent = 'けしました'; };
}

loadSave();
setteiFromUrl().then(()=>showTitle());   // 同じ端末を何人かで使うので、いつも はじめの画面から
</script>
